name: Cerebro - Probar IAs

# Comprueba qué IAs de config/ias.json responden ahora mismo (sin tocar ningún proyecto).
# Se lanza a mano: Actions → Cerebro - Probar IAs → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-genai
      - name: Probar cada modelo
        run: python scripts/probar_ias.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
