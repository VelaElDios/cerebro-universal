name: Cerebro - Proyectos

on:
  schedule:
    - cron: "47 * * * *"  #cada hora, en el minuto 47
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Carpeta del proyecto"
        default: "proyectos/plantilla-sus"

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  avanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROYECTO: ${{ github.event.inputs.proyecto || 'proyectos/plantilla-sus' }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v5

      # Antes de instalar LaTeX: si el proyecto está pausado o terminado, no se hace nada
      - name: Comprobar el estado del proyecto
        id: estado
        run: |
          estado=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1] + "/proyecto.json", encoding="utf-8-sig")).get("estado", "en-construccion"))' "$PROYECTO")
          echo "Estado de $PROYECTO: $estado"
          if [ "$estado" = "en-construccion" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PROYECTO está '$estado': no se hace nada."
          fi

      - name: Preparar Python
        if: steps.estado.outputs.activo == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar LaTeX
        if: steps.estado.outputs.activo == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk biber texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-lang-spanish texlive-bibtex-extra \
            texlive-fonts-recommended

      - name: Instalar librerías
        if: steps.estado.outputs.activo == 'true'
        run: pip install google-genai

      - name: Avanzar el proyecto
        if: steps.estado.outputs.activo == 'true'
        run: python scripts/proyecto.py "$PROYECTO"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Subir el avance
        if: steps.estado.outputs.activo == 'true'
        run: |
          git config user.name "cerebro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyectos
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "proyecto: avance en $(basename "$PROYECTO") $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
