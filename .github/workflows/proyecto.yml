name: Cerebro - Proyectos

# Un solo workflow para todos los proyectos: en cada ejecución avanza UN proyecto
# (el que lleve más tiempo sin ejecutarse) e instala solo lo que ese proyecto necesita.
on:
  schedule:
    - cron: "47 */3 * * *"   # respaldo: el disparador principal es el cron externo (cron-job.org)
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Carpeta del proyecto (vacío = el que toque por turno)"
        default: ""

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  avanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Elige el proyecto y qué instalar. Si no hay ninguno en construcción, no se hace nada más.
      - name: Elegir proyecto
        id: elegir
        run: python scripts/elegir_proyecto.py "$PROYECTO_PEDIDO"
        env:
          PROYECTO_PEDIDO: ${{ github.event.inputs.proyecto }}

      - name: Instalar paquetes del sistema
        if: steps.elegir.outputs.activo == 'true' && steps.elegir.outputs.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ${{ steps.elegir.outputs.apt }}

      - name: Instalar librerías de Python
        if: steps.elegir.outputs.activo == 'true'
        run: pip install google-genai ${{ steps.elegir.outputs.pip }}

      - name: Avanzar el proyecto
        if: steps.elegir.outputs.activo == 'true'
        run: python scripts/proyecto.py "${{ steps.elegir.outputs.proyecto }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PRESUPUESTO_MINUTOS: "50"

      - name: Subir el avance
        if: steps.elegir.outputs.activo == 'true'
        run: |
          git config user.name "cerebro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyectos memoria
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "proyecto: avance en $(basename "${{ steps.elegir.outputs.proyecto }}") $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
