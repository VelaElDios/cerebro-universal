name: Cerebro - Proyectos

on:
  schedule:
    - cron: "47 */2 * * *"   # cada 2 horas, en el minuto 47
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Carpeta del proyecto"
        default: "proyectos/plantilla-sus"

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  avanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROYECTO: ${{ github.event.inputs.proyecto || 'proyectos/plantilla-sus' }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk biber texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-lang-spanish texlive-bibtex-extra \
            texlive-fonts-recommended

      - name: Instalar librerías
        run: pip install google-genai

      - name: Avanzar el proyecto
        run: python scripts/proyecto.py "$PROYECTO"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Subir el avance
        run: |
          git config user.name "cerebro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyectos
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "proyecto: avance en $(basename "$PROYECTO") $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
