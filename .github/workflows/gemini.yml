name: Cerebro - Gemini

on:
  schedule:
    - cron: "17 */3 * * *"  # cada 3 horas, en el minuto 17 (esquiva el atasco de la hora en punto)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # necesario para que el bot pueda hacer push

concurrency:
  group: cerebro             # si hay varias IAs, que no escriban a la vez
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # con los reintentos puede tardar, pero nunca más de esto
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar librería de Gemini
        run: pip install google-genai

      - name: Ejecutar agente Gemini
        run: python scripts/gemini.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-flash-latest,gemini-3.5-flash-lite,gemini-2.5-flash
          PYTHONUNBUFFERED: "1"  # que los mensajes salgan en orden y al momento

      - name: Subir la nota nueva
        run: |
          git config user.name "gemini-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notas-gemini
          if git diff --staged --quiet; then
            echo "No hay notas nuevas"
            exit 0
          fi
          git commit -m "gemini: nueva nota $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
